<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Karaoke Recorder</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
}
h1 { color: gold; }
video {
  width: 100%;
  max-width: 600px;
  border-radius: 10px;
}
button {
  padding: 13px 20px;
  margin: 7px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
}
#recordBtn { background: #e53935; color: white; }
#stopBtn { background: #555; color: white; }
#saveBtn { background: #168a45; color: white; }
#deleteBtn { background: #b3261e; color: white; }
#status { color: gold; margin: 18px; }
audio {
  width: 100%;
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>MASTER KARAOKE RECORDER</h1>

<p>Play your karaoke and record your voice.</p>

<video id="karaoke" controls playsinline>
  <source src="MUSIC TRACK_20261109_183010_0000.mp4" type="video/mp4">
  Your browser does not support video.
</video>

<br><br>

[x] <button id="recordBtn"> RECORD</button>
<button id="stopBtn" disabled>■ STOP</button>

<p id="status">Ready to record your performance.</p>

<h3>Your Recording</h3>

<audio id="playback" controls></audio>

<br>

<button id="saveBtn" disabled>⬇ SAVE RECORDING</button>
<button id="deleteBtn" disabled>DELETE</button>

<script>
const video = document.getElementById("karaoke");
const recordBtn = document.getElementById("recordBtn");
const stopBtn = document.getElementById("stopBtn");
const saveBtn = document.getElementById("saveBtn");
const deleteBtn = document.getElementById("deleteBtn");
const playback = document.getElementById("playback");
const status = document.getElementById("status");

let recorder;
let micStream;
let audioContext;
let recordingBlob = null;
let recordingURL = null;
let hasRecording = false;

async function startRecording() {

  if (hasRecording) {
    const answer = confirm(
      "Your previous recording is not saved. Start a new recording and lose the previous one?"
    );
    if (!answer) return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new AudioContext();

    const destination = audioContext.createMediaStreamDestination();

    const musicSource = audioContext.createMediaElementSource(video);
    const micSource = audioContext.createMediaStreamSource(micStream);

    musicSource.connect(audioContext.destination);
    musicSource.connect(destination);
    micSource.connect(destination);

    await audioContext.resume();

    recorder = new MediaRecorder(destination.stream);
    const chunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size > 0) chunks.push(event.data);
    };

    recorder.onstop = () => {
      recordingBlob = new Blob(chunks, {
        type: recorder.mimeType || "audio/webm"
      });

      if (recordingURL) URL.revokeObjectURL(recordingURL);

      recordingURL = URL.createObjectURL(recordingBlob);
      playback.src = recordingURL;

      hasRecording = true;
      saveBtn.disabled = false;
      deleteBtn.disabled = false;

      status.textContent = "Recording ready. Listen or save it.";

      micStream.getTracks().forEach(track => track.stop());
      audioContext.close();
    };

    recorder.start();

    recordBtn.disabled = true;
    stopBtn.disabled = false;
    status.textContent = "Recording in progress...";

  } catch (error) {
    status.textContent =
      "Microphone error. Please allow microphone permission and try again.";
    console.error(error);
  }
}

function stopRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
    recordBtn.disabled = false;
    stopBtn.disabled = true;
    status.textContent = "Preparing your recording...";
  }
}

function saveRecording() {
  if (!recordingBlob) return;

  const link = document.createElement("a");
  link.href = recordingURL;
  link.download = "my-karaoke-recording.webm";
  document.body.appendChild(link);
  link.click();
  link.remove();

  status.textContent = "Download requested. Check your Downloads folder.";
}

function deleteRecording() {
  if (!hasRecording) return;

  const answer = confirm(
    "Are you sure you want to delete your recording?"
  );

  if (!answer) return;

  playback.pause();
  playback.removeAttribute("src");
  playback.load();

  if (recordingURL) URL.revokeObjectURL(recordingURL);

  recordingURL = null;
  recordingBlob = null;
  hasRecording = false;

  saveBtn.disabled = true;
  deleteBtn.disabled = true;

  status.textContent = "Recording deleted.";
}

recordBtn.onclick = startRecording;
stopBtn.onclick = stopRecording;
saveBtn.onclick = saveRecording;
deleteBtn.onclick = deleteRecording;

</script>
</body>
</html>
